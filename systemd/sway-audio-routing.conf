[Service]
# PULSE_SINK alone only sets the initial destination; pin it against moves.
Environment=PULSE_SINK=sink-sunshine-stereo
Environment="PULSE_PROP=target.object=sink-sunshine-stereo node.dont-move=true node.dont-fallback=true state.restore-target=false"
# Cover native PipeWire applications as well as PulseAudio clients.
Environment="PIPEWIRE_PROPS={ target.object = sink-sunshine-stereo node.dont-move = true node.dont-fallback = true state.restore-target = false }"
